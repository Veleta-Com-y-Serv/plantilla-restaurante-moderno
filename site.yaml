      - { texto: "Celebramos un cumpleaños y estuvieron pendientes de todo, incluida la alergia de mi hija.", autor: Elena S. }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿Hace falta reservar?", respuesta: "Entre semana suele haber sitio. Los viernes y sábados por la noche, mejor reservar con un par de días." }
      - { pregunta: "¿Tenéis opciones sin gluten?", respuesta: "Sí. Casi toda la carta se puede preparar sin gluten y tenemos pan sin gluten. Avísanos al reservar si eres celíaco." }
      - { pregunta: "¿Hay menú del día el fin de semana?", respuesta: "No: el menú del día es de martes a viernes a mediodía. El fin de semana servimos la carta." }
      - { pregunta: "¿Se puede ir con niños?", respuesta: "Claro. Tenemos tronas y medias raciones de algunos platos." }
      - { pregunta: "¿Dónde puedo aparcar?", respuesta: "En el aparcamiento público de la plaza Mayor, a tres minutos andando." }

  contacto:
