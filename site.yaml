      - { nombre: Lubina a la brasa, texto: "Sobre hinojo, naranja y aceite de hierbas.", precio: "22,00 €", imagen: /fotos/especialidad-2.jpg }
      - { nombre: Torrija caramelizada, texto: "Con helado de vainilla y frutos rojos.", precio: "7,00 €", imagen: /fotos/especialidad-3.jpg }

