  sobre:
    activa: true
    antetitulo: La casa
    titulo: Un comedor tranquilo y una cocina abierta
    declaracion: "Cocinamos lo que trae el mercado esa mañana, y lo terminamos a la brasa."
    texto: |
      Olmo abrió en 2021 en un bajo de la calle de la Platería. Lo llevan Clara, en la cocina, y Daniel, en la sala y la bodega.

      Compramos cada día en el mercado del Val y a pequeños productores de la provincia. La carta cambia con la temporada y el menú del día, cada semana.

      La brasa de encina está a la vista: desde muchas mesas se ve cómo se hace tu plato.
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Producto de mercado, texto: "Verdura, pescado y carne que compramos cada mañana." }
      - { titulo: Brasa de encina, texto: "Asados lentos y verduras con sabor a leña." }
      - { titulo: Vinos de la tierra, texto: "Rueda, Cigales, Ribera y Toro, también por copas." }

